<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice | Typing Master</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <section class="practice">

        <h1>Typing Practice</h1>

        <div class="typing-box">

            <p id="paragraph">
                Loading...
            </p>

        </div>

        <textarea id="input" placeholder="Start typing here..."></textarea>

        <div class="result">

            <div>
                <h2 id="wpm">0</h2>
                <span>WPM</span>
            </div>

            <div>
                <h2 id="accuracy">100%</h2>
                <span>Accuracy</span>
            </div>

            <div>
                <h2 id="timer">60</h2>
                <span>Time</span>
            </div>

        </div>

        <button id="restartBtn">
            Restart
        </button>

    </section>

    <script src="../assets/js/practice.js"></script>

</body>

</html>
